server.port=8080

# H2 em memória: roda sem instalação. Console: http://localhost:8080/h2-console
spring.datasource.url=jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# create-drop: schema gerado a partir das entidades (adequado para fins acadêmicos)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# JWT: segredo >= 32 chars (HS256). Em produção, vir de variável de ambiente.
app.jwt.secret=${JWT_SECRET:chave-secreta-academica-com-mais-de-32-caracteres!}
app.jwt.expiration-ms=3600000

# Origem permitida do frontend (CORS)
app.cors.allowed-origin=http://localhost:5173
